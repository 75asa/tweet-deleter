<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="pd-title-dark">
  <title id="pd-title-dark">post-deleter: automatically delete your old posts on X</title>
  <defs>
    <linearGradient id="bg-d" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg-d)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="72" width="248" height="32" rx="16" fill="#13233d" stroke="#2a4a7a"/>
    <text x="80" y="93" font-size="15" font-weight="600" fill="#79c0ff">GitHub Actions &#183; runs daily</text>

    <text x="62" y="204" font-size="62" font-weight="800" fill="#e6edf3" letter-spacing="-1">post-deleter</text>

    <text x="64" y="252" font-size="23" fill="#9ba7b4">Automatically delete your old posts</text>
    <text x="64" y="282" font-size="23" fill="#9ba7b4">on X &#8212; keep the ones that matter.</text>

    <!-- clock icon: hints at the age threshold -->
    <g transform="translate(1176,96)">
      <circle r="36" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="14" y2="8" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
      <circle r="2.5" fill="#58a6ff"/>
      <line x1="0" y1="-30" x2="0" y2="-33" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="30" x2="0" y2="33" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
      <line x1="-30" y1="0" x2="-33" y2="0" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="33" y2="0" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- motion / sweep hint -->
    <g stroke="#2f6fb0" stroke-width="4" stroke-linecap="round" opacity="0.6">
      <line x1="700" y1="300" x2="668" y2="284"/>
      <line x1="712" y1="316" x2="680" y2="300"/>
      <line x1="724" y1="332" x2="692" y2="316"/>
    </g>

    <!-- stacked post cards, fading out -->
    <g>
      <g transform="translate(756,66)">
        <rect width="300" height="64" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="26" cy="32" r="13" fill="#1f3b63" stroke="#3d6fb0"/>
        <rect x="54" y="21" width="190" height="8" rx="4" fill="#c9d1d9"/>
        <rect x="54" y="38" width="140" height="7" rx="3.5" fill="#6e7681"/>
      </g>
      <g transform="translate(780,128)" opacity="0.72">
        <rect width="300" height="64" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="26" cy="32" r="13" fill="#1f3b63" stroke="#3d6fb0"/>
        <rect x="54" y="21" width="190" height="8" rx="4" fill="#c9d1d9"/>
        <rect x="54" y="38" width="140" height="7" rx="3.5" fill="#6e7681"/>
      </g>
      <g transform="translate(804,190)" opacity="0.48">
        <rect width="300" height="64" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="26" cy="32" r="13" fill="#1f3b63" stroke="#3d6fb0"/>
        <rect x="54" y="21" width="190" height="8" rx="4" fill="#c9d1d9"/>
        <rect x="54" y="38" width="140" height="7" rx="3.5" fill="#6e7681"/>
      </g>
      <g transform="translate(828,252)" opacity="0.28">
        <rect width="300" height="64" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="26" cy="32" r="13" fill="#1f3b63" stroke="#3d6fb0"/>
        <rect x="54" y="21" width="190" height="8" rx="4" fill="#c9d1d9"/>
        <rect x="54" y="38" width="140" height="7" rx="3.5" fill="#6e7681"/>
      </g>
      <!-- delete mark on the oldest card -->
      <g transform="translate(1128,252)">
        <circle r="17" fill="#f85149"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
        <line x1="7" y1="-7" x2="-7" y2="7" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
